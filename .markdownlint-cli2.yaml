config:
  MD013: false  # prose is one line per paragraph
  MD060: false  # table pipe spacing
  MD009:
    br_spaces: 2
  MD026:
    punctuation: ".,;:"
  MD041: false  # CLAUDE.md starts with an import, not a heading
  MD024:
    siblings_only: true  # repeated headings under different parents are fine
ignores:
  - scriptize/assets/bash/test/fixtures/**  # inputs for the bats tests, deliberately odd
  - docs/api/**  # generated API pages (mkdocstrings directives and shdoc output)
