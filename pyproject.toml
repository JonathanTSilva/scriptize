[project]
name = "scriptize"
version = "0.1.0"
description = "Improve maintainability, readability, and efficiency of your scripts by standardize your scripting environment."
authors = [
    {name = "Jonathan T. da Silva", email = "jonathantosilva@hotmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "typer>=0.16.0,<0.17",
    "rich>=14.0.0,<15",
    "validators>=0.35.0,<0.36",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "pytest-cov>=6.2.1,<7",
    "ruff>=0.12.1",
    "taskipy>=1.14.1,<2",
    "pyright>=1.1.400",
    "pydantic>=2.11.7,<3",
    "pre-commit>=4.2.0,<5",
    "allure-pytest>=2.15.0,<3",
]
doc = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.15,<10",
    "mkdocstrings>=0.29.1,<0.30",
    "mkdocstrings-python>=1.16.12,<2",
]

[tool.uv]
# A collection of scripts and templates, not an installable package.
package = false

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]

# Putting an entry in `ignore` will ignore all errors that start with that string.
# For example, adding `T` will ignore all errors beginning with `T`,
# whereas adding `T20` will only ignore the `T20` error
# (and probably any errors that start with `T20`)
ignore = [
            'Q000',
            'Q003',
            'CPY001',  # no copyright header in source files
            'COM812',
            'FIX002',
            'TD003',
]
fixable = ["ALL"]  # ['A', 'B', 'C', 'D', 'E', 'F', 'Q']
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# I like the google docstyle
# See https://sphinxcontrib-napoleon.readthedocs.io/en/latest/example_google.html
# and http://google.github.io/styleguide/pyguide.html
# https://gist.github.com/redlotus/3bc387c2591e3e908c9b63b97b11d24e
[tool.ruff.lint.pydocstyle]
convention = 'google'  # Or 'numpy', or 'pep257'

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = [
  ".", "scriptize",
]
addopts = "--doctest-modules"

[tool.taskipy.tasks]
# MAIN COMMANDS
test = "uv run task _check && uv run task _pytest_local"
site = "uv run task _build_site && echo 'Site built successfully! Run `uv run task serve` to preview.' || echo 'Site build failed. Run `uv run task _build_site` for detailed logs.'"
docs = "uv run --group doc mkdocs serve"
serve = "python -m http.server --directory site 8008"

# QUALITY CHECKS
lint = "ruff check . && ruff format --check ."
typecheck = "pyright"
_check = "uv run task lint && uv run task typecheck"
format = "ruff format . && ruff check --fix ."
post_test = "coverage html"

# CORE TEST
_pytest_local = "rm -rf test/allure-results && uv run pytest -s -x --cov=scriptize -vv --alluredir=test/allure-results"
_pytest_ci = "rm -rf test/allure-results && uv run pytest -s --cov=scriptize -vv --alluredir=test/allure-results"

# CORE BUILD
_docs_build = "uv run --group doc mkdocs build --clean"
_report_build = """
mkdir -p test/allure-history && \
cp -r test/allure-history/history test/allure-results/ 2>/dev/null || true && \
uv run python test/scripts/generate_executor.py && \
allure -q generate test/allure-results --clean -o site/test-report/allure && \
cp -r site/test-report/allure/history test/allure-history/
"""
_build_site = """
echo '[1/3] Running tests...' && uv run task _pytest_local >/dev/null 2>&1 && \
echo '[2/3] Building documentation...' && uv run task _docs_build >/dev/null 2>&1 && \
echo '[3/3] Building test report...' && uv run task _report_build >/dev/null 2>&1
"""

# GITHUB CI
ci = "uv run task _check && uv run task _pytest_ci"

[tool.coverage.html]
directory = "site/test-report/coverage"

[tool.coverage.run]
branch = true
source = ["scriptize"]

[tool.pyright]
# TODO: raise to "strict" once the legacy code is typed (see #7).
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = ["scriptize", "test"]
